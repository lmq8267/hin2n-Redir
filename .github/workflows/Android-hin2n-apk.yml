name: 编译android-hin2n

on:
  push:
  workflow_dispatch:
    inputs:
      update_n2n_v2_ipv6:
        description: '是否更新 n2n_v2_ipv6 到最新提交代码？'
        required: false
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
#设置仓库的读写权限
permissions:
  contents: write
  actions: write
env:
  TZ: Asia/Shanghai
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          submodules: recursive
      - name: 更新 n2n_v2_ipv6 子模块到最新提交
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.update_n2n_v2_ipv6 == 'true' }}
        run: |
          cd bundles/n2n_v2_ipv6
          echo "🔄 正在获取最新代码..."
          git fetch origin master
          OLD_HASH=$(git rev-parse HEAD)
          LATEST_HASH=$(git rev-parse origin/master)
          if [ "$OLD_HASH" != "$LATEST_HASH" ]; then
            git checkout origin/master
            echo ""
            echo -e "\033[32m✅ n2n_v2_ipv6 已成功更新到最新提交！\033[0m"
            echo -e "\033[36m📌 提交哈希: \033[1m$LATEST_HASH\033[0m"
            echo -e "\033[36m📋 更新说明:\033[0m"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            git log --oneline --no-decorate "$OLD_HASH".."$LATEST_HASH"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          else
            echo ""
            echo -e "\033[33mℹ️ n2n_v2_ipv6 已是最新提交，无需更新\033[0m"
            echo -e "\033[36m📌 提交哈希: \033[1m$LATEST_HASH\033[0m"
          fi
      - name: 应用 v23 补丁
        run: |
          for patch in patches/n2n_v2_ipv6_*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
      - name: 清理失败和取消的运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
          delete_workflow_pattern: ${{ github.workflow }}        # 只匹配当前同名 workflow
          delete_run_by_conclusion_pattern: "cancelled,failure" # 删除取消+失败，保留成功的
      - name: 下载工具链
        run: |
          #下载jdk sdk ndk工具链
          wget -c -q https://github.com/lmq8267/n2n-2.8.x/releases/download/toolchain/hin2n_byhj.tar.gz -P /opt/gcc/
          tar -xf /opt/gcc/hin2n_byhj.tar.gz -C /opt/gcc/
      - name: 构建 APK
        run: |
         cd Hin2n_android
         #设置编译环境
         sudo timedatectl set-timezone "Asia/Shanghai"
         #sudo apt-get install git automake libssl-dev make gcc
         export JAVA_HOME=/opt/gcc/java/jdk1.8.0_202
         export JRE_HOME=/opt/gcc/java/jdk1.8.0_202/jre
         export CLASSPATH=.:$JAVA_HOME/lib:$JRE_HOME/lib:$CLASSPATH
         export PATH=$JAVA_HOME/bin:$JRE_HOME/bin:$PATH
         export ANDROID_HOME=/opt/gcc/Android/sdk
         export ANDROID_NDK_HOME=$ANDROID_HOME/ndk-bundle
         
         if [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
           echo "使用仓库密钥签名"
           rm -rf app/Hin2n.jks
           echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/Hin2n.jks
           export KEYSTORE_FILE=Hin2n.jks
           export KEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}"
           export KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
           export KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"
           if [ -z "$KEY_ALIAS" ]; then
             export KEY_ALIAS=Hin2n
           fi
           if [ -z "$KEY_PASSWORD" ]; then
             export KEY_PASSWORD="$KEYSTORE_PASSWORD"
           fi
         elif [ -f app/Hin2n.jks ] ; then
           echo "使用仓库现有密钥文件签名"
           export KEYSTORE_FILE=Hin2n.jks
           export KEYSTORE_PASSWORD=My-Hin2n
           export KEY_ALIAS=Hin2n
           export KEY_PASSWORD=My-Hin2n
         else
           echo "生成临时密钥签名"
           export KEYSTORE_FILE=Hin2n.jks
           export KEYSTORE_PASSWORD=My-Hin2n
           export KEY_ALIAS=Hin2n
           export KEY_PASSWORD=My-Hin2n
           keytool -genkeypair -v -keystore app/Hin2n.jks -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 36135 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=Hin2n, OU=Dev, O=Switchy Inc, L=Beijing, S=Beijing, C=CN"
         fi
         ./gradlew assembleRelease
         
      - name: 打包hin2n
        run: |
         mkdir -p /opt/hin2n
         # 查找并移动 APK 文件
         find ./Hin2n_android -type f -name "*.apk" || true
         find ./Hin2n_android -type f -name "*.apk" -exec mv {} /opt/hin2n/ \;
         zip -r hin2n-android.zip /opt/hin2n
      - name : 上传
        uses: actions/upload-artifact@master
        with:
         name: n2n
         path: /opt/hin2n
